name: PantherKeygarden
options:
  bundleIdPrefix: com.pantherkeygarden
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  PantherKeygarden:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Panther Patch 3105
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.pantherkeygarden.patch3105
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.pantherkeygarden.patch3105
            UTTypeDescription: Panther Patch 3105
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - "3105"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pantherkeygarden.admin
        INFOPLIST_KEY_CFBundleDisplayName: Panther Admin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGNING_ALLOWED: NO
